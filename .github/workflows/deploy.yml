name: CI & Deployment Check

on:
  push:
    branches:
      - main

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install
          cd frontend && npm install

      - name: Verify build (Frontend + Backend)
        run: npm run build

      - name: Deployment Status
        run: |
          echo "✅ Build verified successfully!"
          echo "🚀 Code is updated on main branch for Hostinger deployment."

