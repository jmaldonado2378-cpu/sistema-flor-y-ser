name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH (Password Auth)
        if: ${{ secrets.HOSTINGER_SSH_PASSWORD != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER || 'u829089200' }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 65002 }}
          script: |
            mkdir -p ~/public_html/sistema-flor-y-ser
            cd ~/public_html/sistema-flor-y-ser
            if [ ! -d ".git" ]; then
              git clone https://github.com/jmaldonado2378-cpu/sistema-flor-y-ser.git .
            else
              git pull origin main
            fi
            npm install
            cd frontend && npm install && cd ..
            npm run build

      - name: Deploy via SSH (Key Auth)
        if: ${{ secrets.HOSTINGER_SSH_KEY != '' && secrets.HOSTINGER_SSH_PASSWORD == '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER || 'u829089200' }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 65002 }}
          script: |
            mkdir -p ~/public_html/sistema-flor-y-ser
            cd ~/public_html/sistema-flor-y-ser
            if [ ! -d ".git" ]; then
              git clone https://github.com/jmaldonado2378-cpu/sistema-flor-y-ser.git .
            else
              git pull origin main
            fi
            npm install
            cd frontend && npm install && cd ..
            npm run build
